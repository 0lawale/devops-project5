name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Monitoring Stack
    runs-on: ubuntu-latest

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 \
            -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          docker compose version


    #   - name: Validate Prometheus config
    #     run: |
    #       docker run --rm \
    #         -v ${{ github.workspace }}/prometheus:/etc/prometheus \
    #         prom/prometheus:v2.50.0 \
    #         promtool check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/prometheus:/etc/prometheus \
            --entrypoint promtool \
            prom/prometheus:v2.50.0 \
            check config /etc/prometheus/prometheus.yml


      - name: Validate Alertmanager config
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          sudo apt-get install -y gettext-base
          envsubst < alertmanager/alertmanager.yml > /tmp/alertmanager-resolved.yml
          docker run --rm \
            -v /tmp/alertmanager-resolved.yml:/etc/alertmanager/alertmanager.yml \
            --entrypoint amtool \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Start monitoring stack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: sleep 30

      - name: Check Prometheus is up
        run: |
          curl --fail http://localhost:9090/-/healthy
          echo "Prometheus is healthy"

      - name: Check Grafana is up
        run: |
          curl --fail http://localhost:3000/api/health
          echo "Grafana is healthy"

      - name: Check Alertmanager is up
        run: |
          curl --fail http://localhost:9093/-/healthy
          echo "Alertmanager is healthy"

      - name: Check all targets are being scraped
        run: |
          curl http://localhost:9090/api/v1/targets | \
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          targets = data['data']['activeTargets']
          down = [t for t in targets if t['health'] == 'down']
          if down:
              print('DOWN targets:', [t['labels']['job'] for t in down])
              sys.exit(1)
          print('All', len(targets), 'targets are up')
          "

      - name: Tear down stack
        if: always()
        run: docker compose down